server {
    listen 80;
    listen [::]:80;
    server_name axg.prai.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axg.prai.co;

    ssl_certificate     /etc/letsencrypt/live/axg.prai.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axg.prai.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/alloyx;
    index index.html;

    # entry point must always be revalidated so new builds are picked up at once
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # fonts never change contents under the same name -> cache hard
    location ~* \.(woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # media can be replaced in place, so always revalidate:
    # unchanged -> tiny 304, changed -> new file served immediately
    location ~* \.(mp4|webm|webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, no-cache";
        etag on;
    }
    location = /robots.txt   { expires 1h; }
    location = /sitemap.xml  { expires 1h; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
}
